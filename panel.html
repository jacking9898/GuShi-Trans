<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾文 · 对照阅读</title><link rel="icon" href="assets/icon32.png">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"><script type="module" src="panel.js"></script>
</head>
<body class="sw panel-page">
  <header class="sw-floating-header"><div class="sw-inline"><span class="sw-seal sw-seal-small">拾</span><strong class="sw-brand-text">拾文</strong><span id="panel-thinking" class="sw-thinking-status">直接译注</span></div><button id="panel-settings" class="sw-button sw-settings-link" type="button" aria-label="打开拾文设置" title="打开拾文设置">设置</button></header>
  <div class="panel-intro"><span class="sw-eyebrow">原文在侧，疑义在此</span><span class="sw-muted sw-small">选中左侧网页文字，即可继续细读。</span></div>
  <nav id="panel-modes" class="sw-modebar" aria-label="译注阅读方式"><button type="button" class="sw-mode is-active" data-mode="translate" aria-pressed="true">白话翻译</button><button type="button" class="sw-mode" data-mode="explain" aria-pressed="false">字词解释</button><button type="button" class="sw-mode" data-mode="appreciate" aria-pressed="false">诗文赏析</button></nav>
  <main id="panel-body" class="panel-body" aria-label="译注内容"><div class="empty-state"><span class="sw-eyebrow">一字一句，皆可细读</span><h1>选一句，读懂它。</h1><p>在网页选中文字，再点击拾文划词工具。译注会在这里展开，阅读时也能随时对照原文。</p><button id="panel-start" class="sw-button sw-primary" type="button">打开独立阅读页 ↗</button></div></main>
  <footer class="panel-footer">收起侧栏可恢复网页阅读空间。<br>切换三个标签会复用同一次译注。</footer>
</body>
</html>
